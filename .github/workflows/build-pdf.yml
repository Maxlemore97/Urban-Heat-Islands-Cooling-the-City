name: Build report PDF

on:
  push:
    branches: ["**"]
    paths:
      # main.pdf is deliberately NOT listed: the commit that this workflow
      # pushes back only touches the PDF and therefore cannot retrigger it.
      - "**.tex"
      - "**.bib"
      - "figures/**"
      - ".github/workflows/build-pdf.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile main.tex
    runs-on: ubuntu-latest

    env:
      # Fixed epoch (2025-01-01) makes the PDF byte-reproducible: identical
      # sources produce an identical file, so the commit-back step below only
      # fires when the document actually changed.
      SOURCE_DATE_EPOCH: "1735689600"
      FORCE_SOURCE_DATE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: Report_LaTeX
          root_file: main.tex
          latexmk_use_lualatex: false
          latexmk_use_xelatex: false
          # latexmk runs pdflatex + biber + pdflatex as often as needed
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Copy PDF under a distribution name
        run: cp Report_LaTeX/main.pdf biomimicry-report-urban-heat-islands.pdf

      - name: Upload PDF as build artifact
        uses: actions/upload-artifact@v5
        with:
          name: biomimicry-report
          path: biomimicry-report-urban-heat-islands.pdf
          if-no-files-found: error
          retention-days: 30

      # Keep the tracked main.pdf in the repository up to date, so the current
      # PDF is always readable directly on GitHub without downloading an
      # artifact. Only runs on the default branch.
      - name: Commit rebuilt PDF back to the repository
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          if git diff --quiet -- Report_LaTeX/main.pdf; then
            echo "Report_LaTeX/main.pdf is unchanged - nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Report_LaTeX/main.pdf
          git commit -m "Rebuild main.pdf from ${GITHUB_SHA::7} [skip ci]"
          git push

      # Rolling "latest" release so the team always has a stable download link
      # for the current PDF. Only runs on the default branch.
      - name: Publish rolling release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-pdf
          name: Latest report PDF
          body: |
            Automatically built from `${{ github.sha }}`.
            This release is overwritten on every push to `main`.
          files: biomimicry-report-urban-heat-islands.pdf
          prerelease: true
